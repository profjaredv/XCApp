<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dark mode is a deliberate, opt-in choice now (the sidebar's Dark
         mode toggle; see contexts/ThemeProvider.tsx) — .dark only ever gets
         added by that provider, never by the browser/OS's own "force dark
         on every site" setting. Declaring color-scheme: light here is the
         pre-JS default so that OS setting can't auto-repaint unstyled
         native controls (form inputs, scrollbars) before the script below
         runs; index.css's `.dark { color-scheme: dark }` takes over once
         the class is applied. -->
    <meta name="color-scheme" content="light" />
    <!-- Applies a stored dark-mode choice before the stylesheet or React
         ever loads, so a reload doesn't flash light for someone who picked
         dark. Synchronous and inline on purpose — a deferred/module script
         would run after first paint. Keep this key in sync with
         THEME_STORAGE_KEY in contexts/ThemeContext.ts. -->
    <script>
      (function () {
        try {
          if (window.localStorage.getItem('xc_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // Private browsing, or storage blocked — ThemeProvider falls
          // back the same way; nothing to do here.
        }
      })();
    </script>
    <!-- These predate the service worker and are now belt-and-braces at
         most: caching is owned by sw.js (see the VitePWA block in
         vite.config.ts), which precaches the hashed build assets and
         never touches /api. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Installed-app presentation. The manifest (generated by
         vite-plugin-pwa) carries name/icons/display; these are the bits
         that have to live in the document.

         Deliberately NO viewport-fit=cover above: without it iOS keeps a
         standalone web app inside the safe area on its own, so the header
         never slides under a notch and nothing has to be padded with
         env(safe-area-inset-*). Going edge-to-edge is a look, not a
         feature, and it would need every fixed element audited first. -->
    <meta name="theme-color" content="#005827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Home-screen label. short_name in the manifest covers Android;
         iOS reads this. -->
    <meta name="apple-mobile-web-app-title" content="LeadPack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>LeadPack XC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
