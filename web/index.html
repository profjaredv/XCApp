<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app doesn't actually wire up dark mode yet (index.css defines a
         .dark palette, but nothing in the app ever adds that class) — most
         components hardcode light-theme colors directly. Without this, a
         browser/OS "force dark mode on every site" setting repaints those
         unstyled regions on its own heuristics, badly: gradients and
         semi-transparent overlays come out with mismatched, low-contrast
         text. Declaring color-scheme: light opts the page out of that
         auto-repainting until real dark mode support exists. -->
    <meta name="color-scheme" content="light" />
    <!-- These predate the service worker and are now belt-and-braces at
         most: caching is owned by sw.js (see the VitePWA block in
         vite.config.ts), which precaches the hashed build assets and
         never touches /api. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Installed-app presentation. The manifest (generated by
         vite-plugin-pwa) carries name/icons/display; these are the bits
         that have to live in the document.

         Deliberately NO viewport-fit=cover above: without it iOS keeps a
         standalone web app inside the safe area on its own, so the header
         never slides under a notch and nothing has to be padded with
         env(safe-area-inset-*). Going edge-to-edge is a look, not a
         feature, and it would need every fixed element audited first. -->
    <meta name="theme-color" content="#005827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Home-screen label. short_name in the manifest covers Android;
         iOS reads this. -->
    <meta name="apple-mobile-web-app-title" content="LeadPack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>LeadPack XC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
